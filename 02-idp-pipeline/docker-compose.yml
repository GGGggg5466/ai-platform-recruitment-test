services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build: .
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE=default
      - DATA_DIR=/app/data
      - UPSTREAM_TIMEOUT_S=30
      - PYTHONPATH=/app
      - WS04_EMBED_URL=https://ws-04.wade0426.me/embed
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=idp_chunks
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./data:/app/data
    ports:
      - "8081:8080"
    depends_on:
      - redis
      - qdrant

  worker:
    build: .
    command: ["python", "-m", "app.worker"]
    environment:
      - REDIS_URL=redis://redis:6379/0
      - RQ_QUEUE=default
      - DATA_DIR=/app/data
      - UPSTREAM_TIMEOUT_S=30
      - PYTHONPATH=/app
      - WS04_EMBED_URL=https://ws-04.wade0426.me/embed
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=idp_chunks
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=password
    volumes:
      - ./data:/app/data
    depends_on:
      - redis
      - qdrant
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - ./data/qdrant:/qdrant/storage
  neo4j:
    image: neo4j:5
    environment:
      - NEO4J_AUTH=neo4j/password
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - ./data/neo4j:/data
