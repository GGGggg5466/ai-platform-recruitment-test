[project]
name = "idp-splus-blueprint"
version = "0.1.0"
description = "S+ IDP blueprint: async jobs + OCR/VLM routing + resilience + lineage + Qdrant/Neo4j stubs"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "redis>=5.0",
  "rq>=1.16",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
  "orjson>=3.10",
  "tenacity>=8.2",
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pdf2image>=1.17.0",
  "Pillow>=10.0.0",
  "pypdf>=4.0.0",
  "qdrant-client>=1.8.0",
  "neo4j>=5.20",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
